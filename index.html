<!DOCTYPE html>
<html>
<head>
  <title>Карта дефектов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
    .defect-marker {
      background: none;
      border: none;
    }
    .custom-icon {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: red;
      border: 2px solid white;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
    }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 5px 10px;
      border-radius: 5px;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    /* НОВЫЙ СТИЛЬ КНОПКИ */
    #locate-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      border: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #locate-btn:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }
    #locate-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Инициализация карты...</div>
  <!-- Кнопка будет добавлена через JS -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <script>
    // Конфигурация
    const CONFIG = {
      supabase: {
        url: 'https://scurmlyhinusulzvetad.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdXJtbHloaW51c3VsenZldGFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxMjEwNjUsImV4cCI6MjA2MzY5NzA2NX0.D4cshax0gc7VG_GYawBckqVFQesOGJyPyDznCqsfs0k'
      },
      map: {
        center: [59.934280, 30.335098], // СПб
        zoom: 13,
        tileLayer: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
      }
    };

    // Глобальные переменные
    let map;
    let supabaseClient;
    let userLocationCircle = null; // Для хранения круга геолокации

    // Функция геолокации
    function locateUser() {
      if (!map) return;
      
      map.locate({
        setView: true,
        maxZoom: 16,
        timeout: 10000,
        enableHighAccuracy: true // Для большей точности
      });
    }

    // Инициализация карты
    function initMap() {
      map = L.map('map').setView(CONFIG.map.center, CONFIG.map.zoom);
      L.tileLayer(CONFIG.map.tileLayer).addTo(map);
      
      // Создаем кнопку геолокации
      const btn = document.createElement('button');
      btn.id = 'locate-btn';
      btn.innerHTML = '📍';
      document.body.appendChild(btn);
      btn.addEventListener('click', locateUser);
      
      // Обработчики геолокации
      map.on('locationfound', (e) => {
        // Удаляем предыдущий круг, если есть
        if (userLocationCircle) {
          map.removeLayer(userLocationCircle);
        }
        
        // Создаем новый круг с фиксированным радиусом 5 метров
        userLocationCircle = L.circle(e.latlng, {
          radius: 5, // Фиксированный радиус 5 метров
          color: '#136AEC',
          fillColor: '#2A93EE',
          fillOpacity: 0.3, // Полупрозрачный
          weight: 1
        }).addTo(map);
        
        // Центрируем карту с небольшим смещением вверх
        map.setView(e.latlng, 16, {
          animate: true,
          duration: 1
        });
      });
      
      map.on('locationerror', (e) => {
        console.error("Геолокация недоступна:", e.message);
        updateStatus("Разрешите доступ к геопозиции", true);
      });
    }

    // Остальные функции (updateStatus, createCustomIcon, addDefectMarker, loadDefects)
    // ... (остаются без изменений, как в вашем предыдущем коде)
    
    function updateStatus(message, isError = false) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.style.background = isError ? '#ffebee' : 'white';
      status.style.color = isError ? '#d32f2f' : 'black';
    }

    const iconTypes = {
      'яма': { color: '#e53935', symbol: '🕳️' },
      'кочка': { color: '#fb8c00', symbol: '⛰️' },
      'трещина': { color: '#fdd835', symbol: '⚡' },
      'default': { color: '#4285f4', symbol: '❓' }
    };

    function createCustomIcon(type) {
      const style = iconTypes[type.toLowerCase()] || iconTypes.default;
      return L.divIcon({
        className: 'defect-marker',
        html: `<div class="custom-icon" style="background:${style.color}">${style.symbol}</div>`,
        iconSize: [30, 30]
      });
    }

    function addDefectMarker(defect) {
      try {
        let lat, lng;
        
        if (defect.coordinates?.coordinates) {
          [lng, lat] = defect.coordinates.coordinates;
        } else if (defect.latitude && defect.longitude) {
          lat = defect.latitude;
          lng = defect.longitude;
        } else if (Array.isArray(defect.coordinates)) {
          [lat, lng] = defect.coordinates;
          if (Math.abs(lat) > 90 || Math.abs(lng) > 180) {
            [lng, lat] = defect.coordinates;
          }
        } else {
          throw new Error("Неизвестный формат координат");
        }

        const marker = L.marker([lat, lng], {
          icon: createCustomIcon(defect.type)
        }).bindPopup(`
          <b>Тип:</b> ${defect.type}<br>
          <b>Дата:</b> ${new Date(defect.timestamp).toLocaleString()}<br>
          <b>Координаты:</b> ${lat.toFixed(5)}, ${lng.toFixed(5)}
        `);
        
        marker.addTo(map);
        return true;
      } catch (error) {
        console.error(`Ошибка маркера (ID ${defect.id || 'unknown'}):`, error);
        return false;
      }
    }

    async function loadDefects() {
      if (!supabaseClient) {
        updateStatus("База данных не подключена", true);
        return;
      }

      updateStatus("Загрузка данных...");
      
      try {
        const { data, error } = await supabaseClient
          .from('defects')
          .select('*')
          .order('timestamp', { ascending: false })
          .limit(100);
        
        if (error) throw error;
        if (!data?.length) throw new Error("Нет данных о дефектах");

        map.eachLayer(layer => {
          if (layer instanceof L.Marker) map.removeLayer(layer);
        });

        const successCount = data.filter(addDefectMarker).length;
        updateStatus(`Загружено: ${successCount}/${data.length} дефектов`);
        
      } catch (error) {
        console.error("Ошибка загрузки:", error);
        updateStatus(`Ошибка: ${error.message}`, true);
      }
    }

    // Инициализация приложения
    function initSupabase() {
      try {
        supabaseClient = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.key);
        return true;
      } catch (error) {
        console.error("Ошибка Supabase:", error);
        updateStatus("Ошибка подключения к базе", true);
        return false;
      }
    }

    function initializeApp() {
      if (!initSupabase()) return;
      initMap();
      loadDefects();
      setInterval(loadDefects, 300000);
    }

    // Запуск
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      initializeApp();
    }
  </script>
</body>
</html>
