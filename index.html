<!DOCTYPE html>
<html>
<head>
  <title>Карта дефектов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
    .defect-marker {
      background: none;
      border: none;
    }
    .custom-icon {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: red;
      border: 2px solid white;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
    }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 5px 10px;
      border-radius: 5px;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    /* Стиль кнопки геолокации */
    #locate-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      border: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #locate-btn:hover {
      background: #f0f0f0;
      transform: scale(1.05);
    }
    #locate-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Инициализация карты...</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <script>
    // Конфигурация
    const CONFIG = {
      supabase: {
        url: 'https://scurmlyhinusulzvetad.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdXJtbHloaW51c3VsenZldGFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxMjEwNjUsImV4cCI6MjA2MzY5NzA2NX0.D4cshax0gc7VG_GYawBckqVFQesOGJyPyDznCqsfs0k'
      },
      map: {
        center: [59.934280, 30.335098], // СПб
        zoom: 13,
        tileLayer: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
      }
    };

    // Глобальные переменные
    let map;
    let supabaseClient;
    let userLocationMarker = null;

    // Функция геолокации
    function locateUser() {
      if (!map) return;
      
      updateStatus("Определение местоположения...");
      
      // Очищаем предыдущий маркер
      if (userLocationMarker) map.removeLayer(userLocationMarker);
      
      // Проверяем поддержку геолокации
      if (!navigator.geolocation) {
        updateStatus("Геолокация не поддерживается вашим браузером", true);
        return;
      }
      
      // Запрашиваем геолокацию
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLocation = L.latLng(position.coords.latitude, position.coords.longitude);
          
          // Создаем маркер с эмодзи 📍
          userLocationMarker = L.marker(userLocation, {
            icon: L.divIcon({
              className: 'location-pin',
              html: '<div style="font-size:24px">📍</div>',
              iconSize: [32, 32],
              iconAnchor: [16, 32]
            })
          }).addTo(map);
          
          // Масштабируем карту с анимацией
          map.flyTo(userLocation, 17, {
            duration: 1,
            easeLinearity: 0.25
          });
          
          updateStatus("Местоположение определено");
        },
        (error) => {
          console.error("Ошибка геолокации:", error);
          let message = "Ошибка определения местоположения";
          switch(error.code) {
            case error.PERMISSION_DENIED:
              message = "Доступ к геолокации запрещен. Разрешите доступ в настройках браузера";
              break;
            case error.POSITION_UNAVAILABLE:
              message = "Информация о местоположении недоступна";
              break;
            case error.TIMEOUT:
              message = "Время ожидания истекло";
              break;
          }
          updateStatus(message, true);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    // Инициализация карты
    function initMap() {
      map = L.map('map').setView(CONFIG.map.center, CONFIG.map.zoom);
      L.tileLayer(CONFIG.map.tileLayer).addTo(map);
      
      // Создаем кнопку геолокации
      const btn = document.createElement('button');
      btn.id = 'locate-btn';
      btn.innerHTML = '📍';
      document.body.appendChild(btn);
      btn.addEventListener('click', locateUser);
    }

    // ... (остальные функции остаются без изменений) ...

    // Инициализация приложения
    function initSupabase() {
      try {
        supabaseClient = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.key);
        return true;
      } catch (error) {
        console.error("Ошибка Supabase:", error);
        updateStatus("Ошибка подключения к базе", true);
        return false;
      }
    }

    function initializeApp() {
      if (!initSupabase()) return;
      initMap();
      loadDefects();
      setInterval(loadDefects, 300000);
    }

    // Запуск
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      initializeApp();
    }
  </script>
</body>
</html>
