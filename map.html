<!DOCTYPE html>
<html>
<head>
  <title>Карта дефектов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
    .marker-icon { 
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: red;
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <script>
    // 1. Инициализация
    console.log("Запуск приложения...");
    const supabaseUrl = 'https://scurmlyhinusulzvetad.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdXJtbHloaW51c3VsenZldGFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgxMjEwNjUsImV4cCI6MjA2MzY5NzA2NX0.D4cshax0gc7VG_GYawBckqVFQesOGJyPyDznCqsfs0k';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);
    
    // 2. Создание карты
    const map = L.map('map').setView([55.751244, 37.618423], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    console.log("Карта создана");

    // 3. Функция добавления маркера
    function addDefectMarker(defect) {
      const [lat, lng] = defect.coordinates;
      const marker = L.marker([lat, lng], {
        icon: L.divIcon({
          className: 'defect-marker',
          html: `<div class="marker-icon"></div>`,
          iconSize: [25, 25]
        })
      }).bindPopup(`<b>${defect.type}</b><br>${defect.timestamp}`);
      
      marker.addTo(map);
      console.log("Добавлен маркер:", defect);
    }

    // 4. Загрузка данных
    async function loadDefects() {
      console.log("Загрузка дефектов...");
      try {
        const { data, error } = await supabase
          .from('defects')
          .select('*');
        
        if (error) throw error;
        
        console.log("Получено дефектов:", data.length);
        data.forEach(addDefectMarker);
        
      } catch (error) {
        console.error("Ошибка загрузки:", error);
      }
    }

    // 5. Запуск
    document.addEventListener('DOMContentLoaded', () => {
      console.log("DOM загружен");
      loadDefects();
    });
  </script>
</body>
</html>
