<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта дефектов</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #map { height: 100vh; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([59.93, 30.31], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Загрузка данных дефектов
        fetch('https://ваш-api.ru/defects')
            .then(response => response.json())
            .then(defects => {
                defects.forEach(defect => {
                    L.marker([defect.coordinates[0], defect.coordinates[1]])
                        .bindPopup(`Тип: ${defect.type}<br>Критичность: ${defect.criticality}`)
                        .addTo(map);
                });
            });
    </script>
</body>
</html>
